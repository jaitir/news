services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_aggregator}
      POSTGRES_USER: ${POSTGRES_USER:-media_aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-media_aggregator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media_aggregator} -d ${POSTGRES_DB:-media_aggregator}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-media_aggregator}:${POSTGRES_PASSWORD:-media_aggregator}@db:5432/${POSTGRES_DB:-media_aggregator}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-true}
      EVENT_REGISTRY_API_KEY: ${EVENT_REGISTRY_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
      TELEGRAM_USE_GLOBAL_SEARCH: ${TELEGRAM_USE_GLOBAL_SEARCH:-true}
      TELEGRAM_ALLOW_PAID_STARS: ${TELEGRAM_ALLOW_PAID_STARS:-0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
